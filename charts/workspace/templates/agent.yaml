{{- if .Values.agent.enabled }}
# Dedicated workspace agent (h2c): loads the workspace role presets, bootstraps
# the workspace tenant, and seeds the extensions' config into its cfg KV.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ .Values.agent.service.name }}
  namespace: {{ include "workspace.namespace" . }}
  labels:
    {{- include "workspace.labels" . | nindent 4 }}
    app: {{ .Values.agent.service.name }}
spec:
  replicas: {{ .Values.agent.replicas }}
  strategy:
    type: RollingUpdate
    rollingUpdate:
      # Never take the only healthy replica down first: a single-replica
      # deployment would otherwise have a brief outage on every rollout.
      maxUnavailable: 0
      maxSurge: 1
  selector:
    matchLabels:
      app: {{ .Values.agent.service.name }}
  template:
    metadata:
      labels:
        {{- include "workspace.labels" . | nindent 8 }}
        app: {{ .Values.agent.service.name }}
    spec:
      serviceAccountName: {{ include "workspace.saName" . }}
      containers:
        - name: agent
          image: {{ .Values.agent.image.repository }}:{{ .Values.agent.image.tag }}
          imagePullPolicy: {{ .Values.agent.image.pullPolicy }}
          env:
            - name: NATS_URL
              value: {{ include "workspace.natsUrl" . | quote }}
            {{- if eq .Values.agent.db.backend "pg" }}
            # Postgres metadata backend: required for MULTI-REPLICA (a shared
            # sqlite file cannot be written by >1 replica). The agent's PG
            # migrations are advisory-locked, so N replicas may cold-boot safely.
            - name: DB_BACKEND
              value: pg
            - name: POSTGRES_HOST
              value: {{ .Values.agent.db.postgres.host | quote }}
            - name: POSTGRES_PORT
              value: {{ .Values.agent.db.postgres.port | quote }}
            - name: POSTGRES_USER
              value: {{ .Values.agent.db.postgres.user | quote }}
            - name: POSTGRES_PASSWORD
              value: {{ .Values.agent.db.postgres.password | quote }}
            - name: POSTGRES_DB_AGENT
              value: {{ .Values.agent.db.postgres.database | quote }}
            {{- else }}
            - name: DB_BACKEND
              value: sqlite
            - name: DATABASE_URL
              value: sqlite:///data/agent.db
            {{- end }}
            - name: PORT
              value: {{ .Values.agent.port | quote }}
            # Plain HTTP/1.1 liveness/readiness port (kubelet probes cannot
            # speak the h2c RPC port). Readiness fails when the bus is dead.
            - name: AGENT_HEALTH_PORT
              value: {{ .Values.agent.healthPort | quote }}
            - name: HTTP_PROTOCOL
              value: h2c
            - name: AGENT_CORS_ORIGIN
              value: {{ .Values.agent.corsOrigin | quote }}
            - name: AGENT_AUTH_MODE
              value: "required"
            - name: AGENT_ADMIN_TOKEN
              value: {{ .Values.agent.auth.adminToken | quote }}
            - name: AGENT_BOOTSTRAP_TENANT
              value: {{ .Values.agent.auth.bootstrapTenant | quote }}
            - name: AGENT_BOOTSTRAP_TOKEN
              value: {{ .Values.agent.auth.bootstrapToken | quote }}
            # Workspace role presets (immutable, deployment-seeded).
            - name: SYSTEM_PRESETS_FILE
              value: /etc/workspace-presets/system-presets.json
            {{- if .Values.agent.disabledTools }}
            - name: DISABLED_TOOLS
              value: {{ .Values.agent.disabledTools | quote }}
            {{- end }}
            # Idle-turn watchdog (owned by the agent): re-trigger a session that
            # stopped mid-task after a tool call.
            - name: IDLEWATCH_ENABLED
              value: {{ .Values.agent.idlewatch.enabled | quote }}
            - name: IDLEWATCH_INTERVAL
              value: {{ .Values.agent.idlewatch.interval | quote }}
            # Recover turns killed mid-flight (SIGTERM/OOM/restart) at boot
            # instead of waiting for the first idlewatch sweep.
            - name: RESUME_DANGLING_ON_BOOT
              value: {{ .Values.agent.idlewatch.resumeDanglingOnBoot | quote }}
            # Seed extension config into the cfg KV (create-if-absent; a UI-set
            # value always wins). `tenant: "*"` fans out to every known tenant.
            # The gateway/forgejo endpoints come from this chart; sandboxes are
            # launched from ANY image (list-oci-images browses the registry).
            - name: AGENT_EXT_CONFIG_SEED
              value: {{ list
                (dict "tenant" .Values.workspaceExtension.seedTenant "extId" "workspace" "name" "gateway-url" "value" (printf "http://workspace-gateway.%s.svc.cluster.local:80" (include "workspace.namespace" .)))
                (dict "tenant" .Values.workspaceExtension.seedTenant "extId" "workspace" "name" "gateway-token" "value" .Values.gateway.serviceToken.token)
                (dict "tenant" .Values.playwright.seedTenant "extId" "playwright" "name" "selenium-url" "value" .Values.infra.seleniumUrl)
                | toJson | quote }}
            {{- include "workspace.objectStoreEnv" . | nindent 12 }}
            {{- include "workspace.egressProxyEnv" . | nindent 12 }}
          ports:
            - { containerPort: {{ .Values.agent.port }}, protocol: TCP }
            {{- if gt (int .Values.agent.healthPort) 0 }}
            - { containerPort: {{ .Values.agent.healthPort }}, protocol: TCP, name: health }
            {{- end }}
          {{- if gt (int .Values.agent.healthPort) 0 }}
          # The agent is a SINGLE Node process running many concurrent turns
          # against a synchronous sqlite driver; under load the event loop can
          # briefly starve the health listener. A 1s probe timeout caused false
          # kills (and cancelled in-flight turns), so allow a generous timeout.
          livenessProbe:
            httpGet: { path: /health, port: health }
            initialDelaySeconds: 15
            periodSeconds: 15
            failureThreshold: 3
            timeoutSeconds: 5
          readinessProbe:
            httpGet: { path: /ready, port: health }
            initialDelaySeconds: 5
            periodSeconds: 10
            failureThreshold: 3
            timeoutSeconds: 3
          {{- end }}
          resources:
            {{- toYaml .Values.agent.resources | nindent 12 }}
          volumeMounts:
            - { mountPath: /etc/workspace-presets, name: presets, readOnly: true }
            {{- if and .Values.agent.persistence.enabled (ne .Values.agent.db.backend "pg") }}
            - { mountPath: /data, name: data, subPath: {{ .Values.agent.persistence.subPath }} }
            {{- end }}
      volumes:
        - name: presets
          configMap: { name: workspace-presets }
        {{- if and .Values.agent.persistence.enabled (ne .Values.agent.db.backend "pg") }}
        - name: data
          hostPath:
            path: {{ .Values.agent.persistence.hostPath }}
            type: {{ .Values.agent.persistence.type }}
        {{- end }}
{{- if gt (int .Values.agent.replicas) 1 }}
---
# Keep at least one replica available during voluntary disruptions (node drain,
# rollout). With replicas=2 this permits evicting one at a time.
apiVersion: policy/v1
kind: PodDisruptionBudget
metadata:
  name: {{ .Values.agent.service.name }}
  namespace: {{ include "workspace.namespace" . }}
  labels:
    {{- include "workspace.labels" . | nindent 4 }}
    app: {{ .Values.agent.service.name }}
spec:
  minAvailable: 1
  selector:
    matchLabels:
      app: {{ .Values.agent.service.name }}
{{- end }}
---
apiVersion: v1
kind: Service
metadata:
  name: {{ .Values.agent.service.name }}
  namespace: {{ include "workspace.namespace" . }}
  labels:
    {{- include "workspace.labels" . | nindent 4 }}
spec:
  type: {{ .Values.agent.service.type }}
  selector:
    app: {{ .Values.agent.service.name }}
  ports:
    - name: h2c
      port: 80
      targetPort: {{ .Values.agent.port }}
      appProtocol: kubernetes.io/h2c
{{- end }}
